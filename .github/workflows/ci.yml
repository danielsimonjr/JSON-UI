name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # Build first: the headless/react workspace packages import the built
        # @json-ui/core (its types live in dist/index.d.ts via tsup). typecheck
        # and tests fail with "Cannot find module '@json-ui/core'" otherwise.
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test
